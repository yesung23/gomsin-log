name: Two-account PR validation

# Validation gate for the `kiro/two-account-v1-completion` PR family.
#
# This is a THIRD, separate workflow on purpose, and it must stay that way:
#
#   - web-release-validation.yml triggers only on base
#     `kiro/release-hardening-2026-07-31` and hard-asserts a pinned SHA, tree and
#     file count. It encodes a security review boundary for a specific
#     transferred history and must never be edited to widen its trigger.
#   - native-release-validation.yml triggers only on base
#     `kiro/complete-v1-overnight` and carries the Android/iOS work for that
#     branch.
#
# Neither of those fires for a PR based on `kiro/two-account-v1-completion`, so
# that branch family had NO independent CI evidence at all -- which is exactly how
# two failing tests survived a "all gates green" report. This file closes that gap
# with its own exact base assertion, without touching either review boundary.
#
# Everything here is read-only. No secret is referenced, no token with write scope
# is requested, and there is no deploy, merge, migration, signing or store-upload
# step. Third-party actions are pinned by full commit SHA.

on:
  pull_request:
    branches:
      - kiro/two-account-v1-completion

permissions:
  contents: read

concurrency:
  group: two-account-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Non-secret placeholders. The build only needs a syntactically valid URL and a
  # publishable (anon) key shape; neither points at a real project.
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_public_key_not_a_secret

jobs:
  boundary:
    name: Base-branch boundary and diff integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: This workflow may only validate its own PR family
        shell: bash
        env:
          EXPECTED_BASE_REF: kiro/two-account-v1-completion
        run: |
          set -euo pipefail
          # Asserted rather than assumed: if the trigger is ever widened, this job
          # fails instead of silently lending its green tick to another branch.
          test "${GITHUB_BASE_REF}" = "${EXPECTED_BASE_REF}"
          echo "Base ref is ${GITHUB_BASE_REF}, as required."

      - name: No whitespace corruption in the diff this branch adds
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "${BASE_SHA}"
          git diff --check "${BASE_SHA}..HEAD"

      - name: The object graph is intact
        run: git fsck --no-dangling --no-reflogs --connectivity-only

  web:
    name: Typecheck, lint, Vitest, both build directions, CSP and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run every Vitest suite
        run: npm run test

      - name: Verify the native configuration invariants on their own
        run: npm run verify:native

      - name: Build with non-secret placeholders
        run: npm run build

      - name: A build with no Supabase environment MUST fail, naming the variable
        shell: bash
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: |
          set -uo pipefail
          if npm run build > "${RUNNER_TEMP}/bare-build.log" 2>&1; then
            echo 'A build with no Supabase environment succeeded; the guard is gone.' >&2
            exit 1
          fi
          grep -F 'VITE_SUPABASE_URL' "${RUNNER_TEMP}/bare-build.log"
          echo 'The bare build failed and named VITE_SUPABASE_URL, as required.'

      - name: Rebuild with placeholders and scan the generated CSP
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          if grep -R -E '__SUPABASE_(HTTP|CONNECT)_SRC__' dist; then
            echo 'A CSP marker survived in dist.' >&2
            exit 1
          fi
          grep -F 'Content-Security-Policy:' dist/_headers
          grep -F 'https://example.supabase.co' dist/_headers
          grep -F 'wss://example.supabase.co' dist/_headers

      - name: Verify the generated app assets are byte-identical to the committed ones
        run: npm run verify:assets

  browser:
    name: Real-browser creator/partner matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Install Chromium at the version pinned in package.json
        run: npx playwright install --with-deps chromium

      - name: Creator/partner matrix against the production bundle
        shell: bash
        run: |
          set -euo pipefail
          # The suite serves the real production build with the public
          # placeholders above and intercepts every Supabase call per browser
          # context. No real project is contacted and no credential is needed.
          #
          # Failures are diagnosed from this job's own log on purpose: uploading a
          # report artifact is deliberately NOT done here, so this workflow
          # publishes nothing at all.
          npm run test:e2e

  deno-edge:
    name: Deno Edge Function validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.5.6

      - name: Set up Node.js for npm imports
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph for Deno npm imports
        run: npm ci

      - name: Typecheck Edge Function modules
        run: npm run check:edge

      - name: Run the real-Deno Edge Function tests
        run: npm run test:edge

  dependency-policy:
    name: Audit allowlist and brace-expansion topology
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Accept only the documented React Router advisory
        shell: bash
        run: |
          set +e
          npm audit --json > "${RUNNER_TEMP}/npm-audit.json"
          audit_status=$?
          set -e
          if [ "${audit_status}" -gt 1 ]; then
            echo "npm audit failed operationally with status ${audit_status}" >&2
            exit "${audit_status}"
          fi
          node scripts/ci/validate-npm-audit.mjs "${RUNNER_TEMP}/npm-audit.json"

      - name: Assert the brace-expansion major lines
        shell: bash
        run: |
          set -euo pipefail
          npm ls brace-expansion --all | tee "${RUNNER_TEMP}/brace.txt"
          grep -F 'brace-expansion@1.1.18 overridden' "${RUNNER_TEMP}/brace.txt"
          grep -E 'brace-expansion@5\.' "${RUNNER_TEMP}/brace.txt"
          grep -F 'minimatch@3.1.5' "${RUNNER_TEMP}/brace.txt"

          majors="$(grep -o -E 'brace-expansion@[0-9]+' "${RUNNER_TEMP}/brace.txt" \
            | sed 's/.*@//' | sort -u | tr '\n' ' ')"
          if [ "${majors}" != "1 5 " ]; then
            echo "Unexpected brace-expansion major lines: ${majors}" >&2
            exit 1
          fi
          if grep -E 'brace-expansion@[234]\.' "${RUNNER_TEMP}/brace.txt"; then
            echo 'An unreviewed brace-expansion major appeared.' >&2
            exit 1
          fi

  native-reproducibility:
    name: Capacitor sync reproducibility and generated-file cleanliness
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head with enough history to diff against the base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Build the web bundle the shells wrap
        run: npm run build

      - name: Sync both native projects
        run: |
          npx cap sync android
          npx cap sync ios

      - name: Regenerate every raster asset from the single SVG source
        run: npm run assets:generate

      - name: The tracked tree must be unchanged by sync or by regeneration
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo 'A clean checkout plus build + cap sync + assets:generate changed tracked files:' >&2
            git status --porcelain >&2
            git diff >&2
            exit 1
          fi
          echo 'Clean: sync and asset regeneration reproduce the committed configuration exactly.'

      - name: No build output, dependency cache or machine-local file is tracked
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E \
            -e '^android/build/' \
            -e '^android/\.gradle/' \
            -e '^android/local\.properties$' \
            -e '^android/app/build/' \
            -e '^android/app/src/main/assets/public/' \
            -e '^android/app/src/main/assets/capacitor\.(config|plugins)\.json$' \
            -e '^android/capacitor-cordova-android-plugins/(build|src/main/libs)' \
            -e '^ios/App/(Pods|build|output)/' \
            -e '^ios/App/App/public/' \
            -e '^ios/App/App/(capacitor\.config\.json|config\.xml)$' \
            -e 'xcuserdata' \
            -e '\.(jks|keystore|p12|p8|cer|certSigningRequest|mobileprovision|provisionprofile|xcarchive|ipa)$' \
            -e '(^|/)(keystore\.properties|google-services\.json|ExportOptions\.plist)$' \
            || true)"
          if [ -n "${forbidden}" ]; then
            echo 'These must never be tracked:' >&2
            echo "${forbidden}" >&2
            exit 1
          fi
          echo 'No build output, dependency cache, machine-local file or signing material is tracked.'

  android:
    name: Android unit tests, lint, and debug compile/bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Build and sync the web bundle into android/
        run: |
          npm run build
          npx cap sync android

      - name: Require a real Android SDK rather than skipping quietly
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platforms"
          test -n "${JAVA_HOME_21_X64:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

      - name: JVM configuration tests over the shipped manifest and Gradle config
        shell: bash
        working-directory: android
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android lint (abortOnError is on for this module)
        shell: bash
        working-directory: android
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          ./gradlew --no-daemon :app:lintDebug

      - name: Debug compile and bundle
        shell: bash
        working-directory: android
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug

      - name: The debug artifacts exist and no release signing happened
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/debug/app-debug.aab
          # There is no keystore in this repository, so a release artifact cannot
          # be produced here and must not appear.
          test ! -d app/build/outputs/bundle/release
          echo 'Debug APK and AAB built; no release signing occurred.'

  ios:
    name: iOS unsigned simulator build and configuration validation
    runs-on: macos-latest
    steps:
      - name: Check out the PR head without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Build and sync the web bundle into ios/
        run: |
          npm run build
          npx cap sync ios

      - name: Resolve pods from the committed lockfile only
        shell: bash
        working-directory: ios/App
        run: |
          set -euo pipefail
          # --deployment fails if Podfile.lock would have to change, which is what
          # makes the tracked lockfile meaningful.
          pod install --deployment
          git diff --exit-code -- Podfile.lock

      - name: Lint every plist and the privacy manifest before building
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/App.entitlements
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy

          manifests=0
          while IFS= read -r manifest; do
            python3 -m json.tool "${manifest}" > /dev/null
            echo "${manifest}: OK"
            manifests=$((manifests + 1))
          done < <(find ios/App/App/Assets.xcassets -type f -name Contents.json)
          test "${manifests}" -gt 0
          echo "Linted 3 plists and ${manifests} asset-catalog manifest(s)."

      - name: Unsigned iPhone Simulator build
        shell: bash
        working-directory: ios/App
        run: |
          set -euo pipefail
          # No signing material is available or wanted, so signing is switched off
          # entirely rather than stubbed.
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Confirm nothing was signed
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "${RUNNER_TEMP}/DerivedData/Build/Products" -maxdepth 3 -name 'App.app' -type d | head -1)"
          test -n "${app}"
          if codesign -dvv "${app}" 2>&1 | grep -F 'Authority='; then
            echo 'The simulator build carries a real signing identity; it must not.' >&2
            exit 1
          fi
          test ! -f "${app}/embedded.mobileprovision"
          echo 'Unsigned, as intended: no signing identity and no provisioning profile.'

  secret-scan:
    name: Secret and signing-material scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the PR history for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Scan every commit this branch adds for signing material
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Asserted rather than assumed: if BASE_SHA were empty or the range
          # resolved to nothing, the loop would read no commits and the job would
          # pass while scanning nothing at all.
          test -n "${BASE_SHA}"
          commits="$(git rev-list "${BASE_SHA}..HEAD" | wc -l | tr -d ' ')"
          test "${commits}" -gt 0
          echo "Scanning ${commits} commit(s) in ${BASE_SHA}..HEAD"

          fail=0
          while read -r sha; do
            paths="$(git ls-tree -r --name-only "${sha}" | grep -E \
              -e '\.(jks|keystore|p12|p8|cer|certSigningRequest|mobileprovision|provisionprofile)$' \
              -e '(^|/)(keystore\.properties|google-services\.json|GoogleService-Info\.plist|ExportOptions\.plist)$' \
              -e '(^|/)AuthKey_.*\.p8$' \
              || true)"
            if [ -n "${paths}" ]; then
              echo "Commit ${sha} contains signing material:" >&2
              echo "${paths}" >&2
              fail=1
            fi
          done < <(git rev-list "${BASE_SHA}..HEAD")
          test "${fail}" -eq 0

          if git grep -nIE \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e 'store(Password|File)[[:space:]]*[=:]' \
            -e 'keyPassword[[:space:]]*[=:]' \
            -e 'MIIE[A-Za-z0-9+/]{40,}' \
            HEAD -- ':!package-lock.json' ':!.github/workflows/*'; then
            echo 'A private key or a signing password appears in the tree.' >&2
            exit 1
          fi
          echo 'No keystore, certificate, provisioning profile, store key or signing password in any commit on this branch.'
