# =============================================================
# gitleaks configuration
# =============================================================
#
# The default ruleset is kept in full — `useDefault = true` — and this file only
# ever SUBTRACTS from it in two deliberately narrow places. Nothing here adds a
# rule, relaxes entropy, or disables a detector.
#
# Both exemptions below are scoped as tightly as gitleaks allows, because the
# failure mode of a secret scanner is silence: an allowlist that is one
# character broader than it needs to be is a real credential that never gets
# reported. Neither exemption covers application code that handles production
# key material.

[extend]
useDefault = true

[allowlist]
description = "Spike interop vectors (throwaway keys) and one TypeScript false positive"

# -------------------------------------------------------------
# 1. Cryptographic test vectors
# -------------------------------------------------------------
# Cross-platform interop vectors necessarily CONTAIN private keys — that is the
# whole point of them. iOS (SecKey), Android (JCA) and WebCrypto have to agree
# bit-for-bit on the same input, so the fixed private scalar has to be checked
# in or the comparison is not a comparison.
#
# Every file in this directory is generated by the Phase 1A-1 spike harness and
# carries an explicit marker:
#
#   "_comment": "TEST ONLY throwaway keys ... Not production material."
#
# These keys have never wrapped real user content, never existed on a real
# device, and are not accepted anywhere by the application. Regenerating them is
# a single spike command.
#
# The pattern is anchored to the exact `generated` subdirectory and to `.json`.
# It does NOT cover spike source, application code, migrations or Edge
# Functions — a real credential committed anywhere else in the repository,
# including elsewhere under spike/, is still reported.
paths = [
  '''^spike/e2ee-1a1/vectors/generated/[^/]+\.json$''',
]

# -------------------------------------------------------------
# 2. A single generic-api-key false positive
# -------------------------------------------------------------
# src/crypto/suite.ts passes a signature to SubtleCrypto.verify:
#
#     subtle().verify(
#       { name: 'ECDSA', hash: 'SHA-256' },
#       key,
#       signatureP1363 as BufferSource,
#       ...
#
# The generic-api-key rule reads the identifier `key,` as an assignment and
# takes the next token as its value, reporting the captured "secret" as the
# literal string `signatureP1363` at entropy 3.66. There is no secret on the
# line: that is a function parameter holding a caller-supplied *public* ECDSA
# signature, and the value never leaves the P-1363 verification path.
#
# The regex is fully anchored, so it exempts that exact identifier and nothing
# else — not a substring of a longer credential, and not any other value in the
# file. src/crypto/suite.ts as a whole remains scanned; a genuine credential
# added to it is still reported.
regexes = [
  '''^signatureP1363$''',
]
