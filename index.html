<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="답장이 늦어도, 오늘의 순간은 놓치지 않도록. 군화와 곰신 커플만을 위한 1:1 비공개 데일리 로그 앱" />
    
    <!-- PWA & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FCFBF7" />
    
    <!-- iOS Safari Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="곰신로그" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- OpenGraph -->
    <meta property="og:title" content="곰신로그 · 답장이 늦어도, 오늘의 순간은 놓치지 않도록" />
    <meta property="og:description" content="군화와 곰신 커플만을 위한 1:1 비공개 데일리 로그" />
    <meta property="og:type" content="website" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Referrer policy: never leak the full URL to third parties. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Pretendard is imported by src/styles/index.css from the pinned `pretendard`
      package and served from this origin. It must NOT come back as a CDN
      <link>: the CSP in public/_headers names no third-party style-src or
      font-src, so such a link is blocked in production and the app silently
      falls back to a system font.
    -->
    <title>곰신로그 · 답장이 늦어도, 오늘의 순간은 놓치지 않도록</title>
  </head>
  <body>
    <div id="root"><div data-testid="boot-splash" role="status" aria-label="곰신로그 여는 중" style="min-height:100dvh;background:#FCFBF7;color:#3B2924;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><img data-brand-mark="true" src="/favicon.svg" alt="" aria-hidden="true" width="112" height="112" style="display:block;width:112px;height:112px" /><span data-brand-wordmark="true" aria-hidden="true" style="font-family:ui-rounded,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1">곰신로그</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
