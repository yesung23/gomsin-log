// Android module for the GomsinlogDeviceKeys Capacitor plugin.
// UNEXECUTED: no Android SDK is available in this environment, so this file has
// never been built. See docs/E2EE_1A1_SPIKE_REPORT.md.
ext {
    junitVersion = '4.13.2'
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "app.gomsinlog.devicekeys"
    compileSdk 35
    defaultConfig {
        // The app still installs on the historical minSdk, but the plugin
        // rejects all Device Bootstrap operations below API 31 at runtime;
        // there is no software fallback on API 23-30.
        minSdk 23
        targetSdk 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':capacitor-android')
}
