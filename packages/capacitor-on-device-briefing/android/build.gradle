// Android module for the GomsinlogOnDeviceBriefing Capacitor plugin.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "app.gomsinlog.ondevicebriefing"
    compileSdk 35
    defaultConfig {
        minSdk 23
        targetSdk 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation project(':capacitor-android')
}
