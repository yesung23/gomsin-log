<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">곰신로그 군화와 벚꽃 뿔단추 하트</title>
  <desc id="desc">깊은 올리브색 군화 하트와 화사한 벚꽃색 하트를 세 개의 더플 코트형 뿔단추가 이어 주는 심볼</desc>
  <rect data-brand-background="true" width="1024" height="1024" rx="224" fill="#FCFBF7"/>

  <g data-brand-mark="true">
    <path data-brand-half="military" d="M512 300C452 220 350 205 274 250C185 302 155 405 188 507C227 626 336 728 512 848V300Z" fill="#596B50"/>
    <path data-brand-half="rose" d="M512 300C572 220 674 205 750 250C839 302 869 405 836 507C797 626 688 728 512 848V300Z" fill="#ED6F91"/>

    <!-- Quiet white silhouettes make the two halves read as military life and flower-shoe waiting. -->
    <g data-brand-emblem="military-boot" fill="#FFFDF7" transform="translate(25 20) scale(.9)">
      <path d="M273 548H346L341 615C340 626 347 636 358 641L399 660C414 667 421 679 418 691C415 703 405 710 390 710H270C258 710 249 701 249 689V660C249 650 256 641 266 638L273 636V548Z"/>
      <path d="M254 687H418V705C418 714 411 721 402 721H270C261 721 254 714 254 705V687Z"/>
      <g fill="none" stroke="#596B50" stroke-width="14" stroke-linecap="round">
        <path d="M294 578H333"/>
        <path d="M292 602H331"/>
      </g>
    </g>

    <g data-brand-emblem="cherry-blossom" fill="#FFFDF7" transform="translate(718 625) scale(1.2) translate(-738 -625)">
      <ellipse cx="738" cy="579" rx="27" ry="42"/>
      <ellipse cx="781" cy="611" rx="27" ry="42" transform="rotate(72 781 611)"/>
      <ellipse cx="765" cy="662" rx="27" ry="42" transform="rotate(144 765 662)"/>
      <ellipse cx="711" cy="662" rx="27" ry="42" transform="rotate(-144 711 662)"/>
      <ellipse cx="695" cy="611" rx="27" ry="42" transform="rotate(-72 695 611)"/>
      <path d="M738 611L753 622L747 640H729L723 622Z"/>
    </g>

    <!-- The cord stays quiet; the asymmetric horn toggle is the recognizable closure. -->
    <g fill="none" stroke="#FFF8EA" stroke-width="18" stroke-linecap="round">
      <path d="M366 370C414 365 463 377 507 374C560 370 610 377 658 370"/>
      <path d="M366 510C414 505 463 517 507 514C560 510 610 517 658 510"/>
      <path d="M366 650C414 645 463 657 507 654C560 650 610 657 658 650"/>
    </g>

    <!-- Long, gently curved horn toggles: blunt at the cord hole, pointed at the free end. -->
    <g fill="#3B2924">
      <path d="M430 370C444 358 457 352 472 352H574C586 352 594 360 594 370C594 380 586 388 574 388H472C457 388 444 382 430 370Z" transform="rotate(-50 512 370)"/>
      <path d="M430 510C444 498 457 492 472 492H574C586 492 594 500 594 510C594 520 586 528 574 528H472C457 528 444 522 430 510Z" transform="rotate(-50 512 510)"/>
      <path d="M430 650C444 638 457 632 472 632H574C586 632 594 640 594 650C594 660 586 668 574 668H472C457 668 444 662 430 650Z" transform="rotate(-50 512 650)"/>
    </g>

    <!-- A small cord contact point makes the fastener read as hardware, not decoration. -->
    <g fill="#E9D3B0">
      <ellipse cx="506" cy="375" rx="8" ry="6" transform="rotate(-50 506 375)"/>
      <ellipse cx="506" cy="515" rx="8" ry="6" transform="rotate(-50 506 515)"/>
      <ellipse cx="506" cy="655" rx="8" ry="6" transform="rotate(-50 506 655)"/>
    </g>
  </g>
</svg>
